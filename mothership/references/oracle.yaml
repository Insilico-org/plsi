longevity_llm:
  title: Longevity-LLM (L-LLM, Insilico's aging-biology model)
  url: https://huggingface.co/insilicomedicine/longevity-llm
  notes: >-
    Asked only on Insilico's playground (longevity_llm_playground, shared/l-llm). Output is model_derived; cite
    answers as longevity_llm.

longevity_llm_playground:
  title: Longevity-LLM on Insilico's playground (web, model longevity-llm-0.1)
  url: https://playground.insilico.com/?model=longevity-llm-0.1
  notes: >-
    Web page only (no API): sign-in by a one-time e-mail link sent to the bot's own Grok Bot address; 400 runs per
    account, shown on the page; Temperature and Thinking controls; task text up to 4,000 characters. Topic asks only
    (shared/l-llm). Cite answers as longevity_llm.

pandaclaw:
  title: PandaOmics Agent (Insilico Medicine bioinformatics agent, MCP; formerly PandaClaw)
  url: https://pandaomics.com/pandaclaw-mcp
  api_base: https://pandaomics.com/pandaclaw-mcp
  key_env: [PANDACLAW_MCP_URL, PANDACLAW_BEARER_TOKEN]
  notes: >-
    MCP streamable HTTP; static bearer token. Tools ask{query, session_id?} (billed, never retried) -> {session_id, baseline_event_seq,
    web_url}; wait_for_answer{session_id, since_seq=baseline_event_seq, max_wait_seconds<=60} until answer_allowed or answer_ready;
    read_answer{session_id}. Analyses take minutes. PANDACLAW_MCP_URL overrides api_base.

pandaomics:
  title: PandaOmics (Insilico Medicine target discovery, MCP)
  url: https://pandaomics.com/mcp
  api_base: https://pandaomics.com/mcp
  key_env: [PANDAOMICS_MCP_URL, PANDAOMICS_BEARER_TOKEN]
  notes: MCP streamable HTTP; tools/list then tools/call. PANDAOMICS_MCP_URL overrides api_base.
