<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__PLSI_SCRIPT_HASH__'; style-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLSI report</title>
<style>
:root {
  --accent: #00A607; --accent-dark: #005303; --accent-soft: #D7EED4;
  --pred: #583BA8; --pred-soft: #DBD3F0; --cur: #5B7083; --cur-soft: #DDE3E8;
  --text: #111; --muted: #616161; --border: #E8E8E8; --surface-2: #F7F7F7;
  --font: Arial, Helvetica, "Segoe UI", sans-serif; --mono: "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 var(--font); color: var(--text); background: #fff; }
header { padding: 1.25rem 1.75rem 1rem; border-bottom: 3px solid var(--accent); }
header h1 { margin: 0; font-size: 1.5rem; }
header p { margin: .25rem 0 0; color: var(--muted); font-size: .85rem; font-family: var(--mono); }
main { max-width: 1040px; margin: 0 auto; padding: 1rem 1.75rem 3rem; }
section { border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin: 1rem 0; }
h2 { margin: 0 0 .75rem; font-size: 1.1rem; color: var(--accent-dark); }
h3 { margin: 1rem 0 .4rem; font-size: .95rem; }
h4, h5 { margin: .8rem 0 .3rem; }
a { color: var(--accent-dark); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.25rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
td { font-variant-numeric: tabular-nums; }
pre { background: var(--surface-2); padding: .75rem; border-radius: 8px; overflow-x: auto; font: .8rem/1.4 var(--mono); }
.chart { width: 100%; max-width: 720px; height: auto; display: block; }
.chart text { font: 11px var(--font); fill: var(--muted); }
.chart .grid { stroke: var(--border); }
.chart .obs { stroke: var(--accent); fill: none; stroke-width: 2; }
.chart .dot { fill: var(--accent); }
.chart .band { fill: var(--pred-soft); opacity: .7; }
.chart .bar { stroke: var(--pred); stroke-width: 2; }
.chart .exp { fill: #fff; stroke: var(--pred); stroke-width: 2; }
.chart .link { stroke: var(--pred); stroke-dasharray: 4 3; fill: none; }
.chart .alt { stroke-dasharray: 6 4; } .chart .link.cur { stroke: var(--cur); stroke-dasharray: none; }
.chart .band.cur { fill: var(--cur-soft); } .chart .bar.cur, .chart .exp.cur { stroke: var(--cur); } .chart .band.alt { opacity: .35; } .chart .exp.alt { fill: var(--pred-soft); }
.legend { color: var(--muted); font-size: .8rem; margin: .2rem 0 0; }
.legend .o { color: var(--accent); } .legend .p { color: var(--pred); } .legend .c { color: var(--cur); }
.chart.arrow { max-width: none; }
.arrow .axis { stroke: var(--text); stroke-width: 2; }
.arrow .future { fill: var(--pred-soft); opacity: .35; }
.arrow .now { stroke: var(--muted); stroke-dasharray: 3 3; }
.arrow .stem { stroke: var(--border); }
.arrow .label { font-size: 11px; fill: var(--text); }
.arrow .info { fill: var(--accent); } .arrow .watch { fill: #E8A200; } .arrow .high { fill: #D32F2F; }
.arrow .predicted { fill-opacity: .25; stroke-width: 2; }
.arrow .predicted.info { stroke: var(--pred); fill: var(--pred); }
.arrow .predicted.watch { stroke: #E8A200; } .arrow .predicted.high { stroke: #D32F2F; }
.arrow .window { stroke-width: 6; stroke-linecap: round; opacity: .35; }
.arrow .window.info { stroke: var(--pred); } .arrow .window.watch { stroke: #E8A200; } .arrow .window.high { stroke: #D32F2F; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="meta"></p></header>
<main id="app"></main>
<script type="application/json" id="plsi-payload">__PLSI_PAYLOAD__</script>
<script>
(() => {
  "use strict";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  };
  const svg = (tag, attrs) => {
    const e = document.createElementNS(SVG_NS, tag);
    for (const k of Object.keys(attrs || {})) e.setAttribute(k, String(attrs[k]));
    return e;
  };
  const fmt = (v) => typeof v === "number" ? String(+v.toPrecision(6))
    : v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
  const link = (text, href) => {
    if (typeof href !== "string" || !/^https?:\/\//i.test(href)) return el("span", null, fmt(text));
    const a = el("a", null, fmt(text));
    a.href = href; a.rel = "noopener noreferrer"; a.target = "_blank";
    return a;
  };
  const cell = (v) => v && typeof v === "object" && !Array.isArray(v) && "text" in v ? link(v.text, v.href) : el("span", null, fmt(v));
  const json = (v) => el("pre", "json", JSON.stringify(v, null, 2));

  const INLINE = /\*\*([^*]+)\*\*|\*([^*]+)\*|\[([^\]]+)\]\(([^)\s]+)\)/g;
  const inline = (parent, text) => {
    let last = 0, m;
    INLINE.lastIndex = 0;
    while ((m = INLINE.exec(text))) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) parent.appendChild(el("strong", null, m[1]));
      else if (m[2] !== undefined) parent.appendChild(el("em", null, m[2]));
      else parent.appendChild(link(m[3], m[4]));
      last = INLINE.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  };

  const markdown = (d) => {
    const box = el("div", "md");
    let list = null, para = null;
    for (const line of String(d.text ?? "").split("\n")) {
      const h = /^(#{1,3})\s+(.*)$/.exec(line), li = /^\s*[-*]\s+(.*)$/.exec(line);
      if (!li) list = null;
      if (h) { para = null; const x = box.appendChild(el("h" + (h[1].length + 2))); inline(x, h[2]); }
      else if (li) {
        para = null;
        if (!list) list = box.appendChild(el("ul"));
        inline(list.appendChild(el("li")), li[1]);
      } else if (!line.trim()) para = null;
      else {
        if (para) para.appendChild(document.createTextNode(" ")); else para = box.appendChild(el("p"));
        inline(para, line);
      }
    }
    return box;
  };

  const kv = (d) => {
    const dl = el("dl", "kv");
    for (const it of d.items || []) {
      dl.appendChild(el("dt", null, fmt(it && it.key)));
      dl.appendChild(el("dd")).appendChild(cell(it && it.value));
    }
    return dl;
  };

  const table = (d) => {
    const wrap = el("div", "scroll"), t = wrap.appendChild(el("table"));
    const head = t.appendChild(el("thead")).appendChild(el("tr")), body = t.appendChild(el("tbody"));
    for (const c of d.columns || []) head.appendChild(el("th", null, fmt(c)));
    for (const r of d.rows || []) {
      const row = body.appendChild(el("tr"));
      for (const c of Array.isArray(r) ? r : [r]) row.appendChild(el("td")).appendChild(cell(c));
    }
    return wrap;
  };

  const list = (d) => {
    const ul = el("ul");
    for (const it of d.items || []) ul.appendChild(el("li")).appendChild(cell(it));
    return ul;
  };

  const DAY = 86400000;
  const day = (t) => new Date(t).toISOString().slice(0, 10);
  const series = (s) => ({ name: s.name,
    pts: (s.points || []).map((p) => ({ t: Date.parse(p.t), v: +p.v }))
      .filter((p) => Number.isFinite(p.t) && Number.isFinite(p.v)).sort((a, b) => a.t - b.t),
    pr: (s.predictions || []).map((p) => ({ t: Date.parse(p.t), e: +p.expected, lo: +p.low, hi: +p.high }))
      .filter((p) => [p.t, p.e, p.lo, p.hi].every(Number.isFinite)).sort((a, b) => a.t - b.t) });
  // One chart per group: series sharing a unit and a "<label>: " name prefix share one x/y axis, later ones dashed.
  const chart = (group) => {
    const box = el("div"), ss = group.map(series), unit = group[0].unit;
    const title = ss.length > 1 ? fmt(String(group[0].name).replace(/:[^:]*$/, "")) : fmt(group[0].name);
    box.appendChild(el("h3", null, title + (unit ? " (" + fmt(unit) + ")" : "")));
    const ts = ss.flatMap((s) => s.pts.map((p) => p.t).concat(s.pr.map((p) => p.t)));
    const vs = ss.flatMap((s) => s.pts.map((p) => p.v).concat(...s.pr.map((p) => [p.lo, p.hi])));
    if (!ts.length) { box.appendChild(el("p", "muted", "no data")); return box; }
    let t0 = Math.min(...ts), t1 = Math.max(...ts), y0 = Math.min(...vs), y1 = Math.max(...vs);
    if (t1 === t0) { t0 -= DAY; t1 += DAY; }
    const pad = y1 === y0 ? Math.abs(y0) * 0.1 || 1 : (y1 - y0) * 0.08;
    y0 -= pad; y1 += pad;
    const W = 720, H = 240, L = 60, R = 16, T = 12, B = 28;
    const x = (t) => L + (t - t0) / (t1 - t0) * (W - L - R);
    const y = (v) => T + (y1 - v) / (y1 - y0) * (H - T - B);
    const line = (ps, cls) => svg("polyline", { points: ps.map((p) => x(p.t) + "," + y(p.v)).join(" "), class: cls });
    const root = svg("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img" });
    root.appendChild(svg("title")).textContent = title;
    for (const v of [y0 + pad, (y0 + y1) / 2, y1 - pad]) {
      root.appendChild(svg("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid" }));
      const lab = root.appendChild(svg("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }));
      lab.textContent = fmt(+v.toPrecision(4));
    }
    [[t0, "start"], [t1, "end"]].forEach(([t, anchor]) => {
      root.appendChild(svg("text", { x: x(t), y: H - 8, "text-anchor": anchor })).textContent = day(t);
    });
    const legend = el("p", "legend");
    legend.appendChild(el("span", "o", "● observed"));
    ss.forEach(({ name, pts, pr }, i) => {
      const alt = ss.length > 1 ? (i ? " alt" : " cur") : "";
      if (pr.length > 1) {
        const band = pr.map((p) => x(p.t) + "," + y(p.hi)).concat(pr.slice().reverse().map((p) => x(p.t) + "," + y(p.lo)));
        root.appendChild(svg("polygon", { points: band.join(" "), class: "band" + alt }));
      }
      if (pts.length && pr.length) {
        const last = pts[pts.length - 1];
        const path = [last].concat(pr.filter((p) => p.t >= last.t).map((p) => ({ t: p.t, v: p.e })));
        if (path.length > 1) root.appendChild(line(path, "link" + alt));
      }
      for (const p of pr) {
        root.appendChild(svg("rect", { x: x(p.t) - 5, y: y(p.hi), width: 10, height: Math.max(1, y(p.lo) - y(p.hi)), class: "band" + alt }));
        root.appendChild(svg("line", { x1: x(p.t), x2: x(p.t), y1: y(p.hi), y2: y(p.lo), class: "bar" + alt }));
        const c = root.appendChild(svg("circle", { cx: x(p.t), cy: y(p.e), r: 4, class: "exp" + alt }));
        c.appendChild(svg("title")).textContent = fmt(name) + " predicted " + day(p.t) + ": " + fmt(p.e) + " [" + fmt(p.lo) + ", " + fmt(p.hi) + "]";
      }
      if (pts.length > 1) root.appendChild(line(pts, "obs"));
      for (const p of pts) {
        const c = root.appendChild(svg("circle", { cx: x(p.t), cy: y(p.v), r: 3.5, class: "dot" }));
        c.appendChild(svg("title")).textContent = day(p.t) + ": " + fmt(p.v);
      }
      if (ss.length > 1 && pr.length) legend.appendChild(el("span", i ? "p" : "c", (i ? "   - - " : "   ── ") + fmt(name)));
    });
    box.appendChild(root);
    if (ss.some((s) => s.pr.length)) { legend.appendChild(document.createTextNode("   ")); legend.appendChild(el("span", "p", "▮ predicted interval, ○ expected")); }
    box.appendChild(legend);
    return box;
  };
  const timeseries = (d) => {
    const box = el("div"), groups = new Map();
    for (const s of (d.series || []).map((s) => s || {})) {
      const m = /^(.*):[^:]*$/.exec(String(s.name ?? "")), key = m ? m[1] + "\u0000" + (s.unit ?? "") : groups.size + "\u0001";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const g of groups.values()) box.appendChild(chart(g));
    return box;
  };

  const LEVELS = ["info", "watch", "high"];
  const timeline = (d) => {
    const box = el("div");
    const evs = (d.events || []).map((e) => ({ ...e, t: Date.parse(e.t), te: Date.parse(e.t_end),
      lvl: LEVELS.includes(e.level) ? e.level : "info", pred: e.kind === "predicted" }))
      .filter((e) => Number.isFinite(e.t)).sort((a, b) => a.t - b.t);
    if (!evs.length) { box.appendChild(el("p", "muted", "no events")); return box; }
    const nowT = Date.parse(d.now);
    const ts = evs.map((e) => e.t).concat(evs.map((e) => e.te).filter(Number.isFinite), Number.isFinite(nowT) ? [nowT] : []);
    let t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 === t0) { t0 -= 365 * DAY; t1 += 365 * DAY; }
    const span = t1 - t0; t0 -= span * 0.03; t1 += span * 0.05;
    const LANES = 4, LANE = 26, W = 960, L = 20, R = 30, MID = 30 + LANES * LANE, H = MID * 2 + 20;
    const lin = (t, a, b, xa, xb) => xa + (t - a) / (b - a) * (xb - xa);
    // the future gets 40% of the arrow however long the past is
    const split = Number.isFinite(nowT) && nowT > t0 && nowT < t1 && evs.some((e) => e.t > nowT) ? L + 0.6 * (W - L - R) : null;
    const x = (t) => split === null ? lin(t, t0, t1, L, W - R) : t <= nowT ? lin(t, t0, nowT, L, split) : lin(t, nowT, t1, split, W - R);
    const root = svg("svg", { viewBox: "0 0 " + W + " " + H, class: "chart arrow", role: "img" });
    root.appendChild(svg("title")).textContent = "life arrow";
    if (split !== null) root.appendChild(svg("rect", { x: split, y: 8, width: W - R - split, height: H - 16, class: "future" }));
    root.appendChild(svg("line", { x1: L, x2: W - 8, y1: MID, y2: MID, class: "axis" }));
    root.appendChild(svg("polygon", { points: (W - 4) + "," + MID + " " + (W - 16) + "," + (MID - 6) + " " + (W - 16) + "," + (MID + 6), class: "dot" }));
    let lastTick = -Infinity;
    for (let yr = new Date(t0).getUTCFullYear() + 1; yr <= new Date(t1).getUTCFullYear(); yr++) {
      const tx = x(Date.UTC(yr, 0, 1));
      if (tx < L || tx > W - R || tx - lastTick < 42) continue;
      lastTick = tx;
      root.appendChild(svg("line", { x1: tx, x2: tx, y1: MID - 4, y2: MID + 4, class: "axis" }));
      root.appendChild(svg("text", { x: tx, y: MID + 16, "text-anchor": "middle" })).textContent = yr;
    }
    if (Number.isFinite(nowT)) {
      root.appendChild(svg("line", { x1: x(nowT), x2: x(nowT), y1: 8, y2: H - 8, class: "now" }));
      root.appendChild(svg("text", { x: x(nowT) + 4, y: 14 })).textContent = "now";
    }
    const lastX = new Array(LANES * 2).fill(-Infinity);
    let windows = 0;
    evs.forEach((e, i) => {
      const ex = x(e.t), up = i % 2 === 0;
      let lane = 0;
      for (let k = 0; k < LANES; k++) { const s = (up ? 0 : LANES) + k; if (ex - lastX[s] > 150) { lane = k; break; } lane = k; }
      lastX[(up ? 0 : LANES) + lane] = ex;
      const ly = up ? MID - 22 - lane * LANE : MID + 32 + lane * LANE;
      root.appendChild(svg("line", { x1: ex, x2: ex, y1: MID, y2: ly + (up ? 4 : -10), class: "stem" }));
      if (e.pred && Number.isFinite(e.te) && e.te > e.t) {
        const wy = H - 14 - 8 * (windows++ % 3);
        root.appendChild(svg("line", { x1: ex, x2: x(e.te), y1: wy, y2: wy, class: "window " + e.lvl }));
        root.appendChild(svg("line", { x1: ex, x2: ex, y1: MID, y2: wy, class: "stem" }));
      }
      const m = root.appendChild(svg("circle", { cx: ex, cy: MID, r: e.lvl === "high" ? 7 : e.lvl === "watch" ? 6 : 5,
        class: e.lvl + (e.pred ? " predicted" : "") }));
      const p = Number.isFinite(+e.probability) && e.probability !== null && e.probability !== undefined
        ? " (" + Math.round(+e.probability * 100) + "%)" : "";
      const name = fmt(e.label) + p;
      m.appendChild(svg("title")).textContent = day(e.t) + (Number.isFinite(e.te) ? " to " + day(e.te) : "") + ": " + name
        + (e.detail ? " - " + fmt(e.detail) : "");
      const lab = root.appendChild(svg("text", { x: ex, y: ly, "text-anchor": ex > W - 120 ? "end" : ex < 80 ? "start" : "middle", class: "label" }));
      lab.textContent = name.length > 26 ? name.slice(0, 25) + "…" : name;
    });
    box.appendChild(root);
    const legend = box.appendChild(el("p", "legend"));
    legend.appendChild(el("span", "o", "● past"));
    legend.appendChild(document.createTextNode("   "));
    legend.appendChild(el("span", "p", "◌ predicted (bar = window, % = probability)"));
    legend.appendChild(document.createTextNode("   colour: green info · amber watch · red high"));
    const rows = evs.map((e) => [day(e.t) + (Number.isFinite(e.te) ? " to " + day(e.te) : ""), e.pred ? "predicted" : "past", e.lvl,
      e.href ? { text: e.label, href: e.href } : e.label,
      e.probability === null || e.probability === undefined ? "" : Math.round(+e.probability * 100) + "%", e.detail || ""]);
    box.appendChild(table({ columns: ["when", "kind", "level", "event", "probability", "detail"], rows }));
    return box;
  };

  const RENDERERS = { markdown, kv, table, timeseries, list, timeline };
  let payload;
  try { payload = JSON.parse(document.getElementById("plsi-payload").textContent); }
  catch (e) { payload = { title: "PLSI report", blocks: [{ type: "markdown", data: { text: "The payload could not be parsed." } }] }; }
  document.title = fmt(payload.title || "PLSI report");
  document.getElementById("title").textContent = document.title;
  document.getElementById("meta").textContent = [payload.subject_id, payload.generated_at].filter(Boolean).map(fmt).join(" · ");
  const app = document.getElementById("app");
  for (const b of Array.isArray(payload.blocks) ? payload.blocks : []) {
    const sec = app.appendChild(el("section"));
    if (b && b.title) sec.appendChild(el("h2", null, fmt(b.title)));
    const fn = b && Object.prototype.hasOwnProperty.call(RENDERERS, b.type) ? RENDERERS[b.type] : null;
    let node;
    try { node = fn ? fn(b.data || {}) : json(b); } catch (e) { node = json(b); }
    sec.appendChild(node);
  }
})();
</script>
</body>
</html>
