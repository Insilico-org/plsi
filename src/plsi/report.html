  const ICONS = {
    patient: ["M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", "M4 21c0-4 3.6-6 8-6s8 2 8 6"],
    panel: ["M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z", "M2.5 20c0-3.5 2.9-5.5 6.5-5.5s6.5 2 6.5 5.5", "M16 4.5a3.5 3.5 0 0 1 0 6.5", "M18 14.8c2 .7 3.5 2.4 3.5 5.2"],
    visits: ["M4 6h16v15H4z", "M4 10h16", "M8 3v5", "M16 3v5", "M8 14h3"],
    lab: ["M12 3c-3 4.6-6 7.8-6 11.3a6 6 0 0 0 12 0C18 10.8 15 7.6 12 3z", "M9.5 15a2.5 2.5 0 0 0 2.5 2.5"],
    vitals: ["M20.4 5.6a5 5 0 0 0-7.1 0L12 6.9l-1.3-1.3a5 5 0 0 0-7.1 7.1L12 21l8.4-8.3a5 5 0 0 0 0-7.1z", "M3.5 12H8l1.5-3 3 6 1.5-3h6.5"],
    device: ["M8 7h8v10H8z", "M9.5 7l.8-4h3.4l.8 4", "M9.5 17l.8 4h3.4l.8-4", "M12 10v2.5l1.5 1"],
    medicine: ["M10.6 3.4a5 5 0 0 1 7.1 7.1l-7.2 7.2a5 5 0 0 1-7.1-7.1z", "M7 10l7 7"],
    condition: ["M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z", "M12 9v6", "M9 12h6"],
    diet: ["M5 20c0-9 6-15 15-15 0 9-6 15-15 15z", "M5 20l9-9"],
    plan: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", "M12 12h.01"],
    follow_up: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M12 7v5l3 2"],
    file: ["M6 3h8l4 4v14H6z", "M14 3v4h4", "M9 13h6", "M9 17h4"],
    trend: ["M3 17l6-6 4 4 8-8", "M15 7h6v6"],
    alert: ["M12 3l9.5 17H2.5z", "M12 10v4", "M12 17h.01"],
    note: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M12 11v5", "M12 8h.01"],
    age: ["M6 3h12", "M6 21h12", "M7 3c0 5 10 5 10 9s-10 4-10 9", "M17 3c0 5-10 5-10 9s10 4 10 9"],
  };
  const icon = (name) => {
    const tile = el("span", "ico");
    tile.setAttribute("aria-hidden", "true");
    const g = tile.appendChild(svg("svg", { viewBox: "0 0 24 24" }));
    for (const d of ICONS[name]) g.appendChild(svg("path", { d }));
    return tile;
  };
  const COMPACT = new Set(["parts", "meter"]);
  // Marks on one number line, labels alternating above and below so close values stay readable.
  const scale = (d) => {
    const marks = (d.marks || []).map((m, i) => ({ label: fmt(m && m.label), v: num(m && m.value), cls: tone(m && m.tone, i) }))
      .filter((m) => Number.isFinite(m.v)).sort((a, b) => a.v - b.v);
    const box = el("div");
    if (!marks.length) { box.appendChild(el("p", "muted", "nothing to show yet")); return box; }
    const lo = Math.floor(Math.min(...marks.map((m) => m.v))) - 3, hi = Math.ceil(Math.max(...marks.map((m) => m.v))) + 3;
    const line = box.appendChild(el("div", "scale"));
    line.setAttribute("role", "img");
    line.setAttribute("aria-label", marks.map((m) => m.label + " " + fmt(+m.v.toFixed(1))).join(", "));
    line.appendChild(el("div", "axis"));
    const at = (v) => ((v - lo) / (hi - lo) * 100) + "%";
    for (const v of [lo, hi]) line.appendChild(el("div", "tick", fmt(v))).style.left = at(v);
    marks.forEach((m, i) => {
      line.appendChild(el("div", "pin " + m.cls)).style.left = at(m.v);
      const lab = line.appendChild(el("div", "mlabel " + (i % 2 ? "down" : "up")));
      lab.style.left = at(m.v);
      lab.appendChild(el("b", null, fmt(+m.v.toFixed(1)) + (d.unit ? " " + fmt(d.unit) : "")));
      lab.appendChild(el("span", null, m.label));
    });
    return box;
  };
  // Signed amounts around one zero line: positive to the right, negative to the left, the value at the bar's tip.
  const bars = (d) => {
    const items = (d.items || []).map((b) => ({ label: fmt(b && b.label), v: num(b && b.value), note: b && b.note }))
      .filter((b) => Number.isFinite(b.v));
    const box = el("div");
    if (!items.length) { box.appendChild(el("p", "muted", "nothing to show yet")); return box; }
    const span = Math.max(...items.map((b) => Math.abs(b.v)), 0.5) * 1.25;
    const grid = box.appendChild(el("div", "bars"));
    for (const b of items) {
      grid.appendChild(el("div", "lab", b.label));
      const track = grid.appendChild(el("div", "track"));
      track.appendChild(el("div", "zero")).style.left = "50%";
      const w = Math.abs(b.v) / span * 50;
      const bar = track.appendChild(el("div", "bar " + (b.v >= 0 ? "pos" : "neg")));
      bar.style.width = w + "%"; bar.style.left = (b.v >= 0 ? 50 : 50 - w) + "%";
      const text = (b.v > 0 ? "+" : "") + fmt(+b.v.toFixed(1)) + (d.unit ? " " + fmt(d.unit) : "");
      bar.title = b.label + ": " + text + (b.note ? " · " + fmt(b.note) : "");
      const val = track.appendChild(el("div", "val", text));
      if (b.v >= 0) val.style.left = "calc(" + (50 + w) + "% + 6px)"; else val.style.right = "calc(" + (50 + w) + "% + 6px)";
    }
    const note = grid.appendChild(el("div", "axisnote"));
    note.appendChild(el("span", null, fmt(d.left || "makes it younger")));
    note.appendChild(el("span", null, fmt(d.right || "makes it older")));
    return box;
  };

  const RENDERERS = { markdown, kv, table, timeseries, list, timeline, parts, meter, scale, bars };
  let payload;
  try { payload = JSON.parse(document.getElementById("plsi-payload").textContent); }
  catch (e) { payload = { title: "PLSI report", blocks: [{ type: "markdown", data: { text: "The payload could not be parsed." } }] }; }
  document.title = fmt(payload.title || "PLSI report");
  document.getElementById("title").textContent = document.title;
  const every = Number.isInteger(payload.refresh_seconds) && payload.refresh_seconds >= 60 ? payload.refresh_seconds : 0;
  const when = Date.parse(payload.generated_at);
  const updated = Number.isFinite(when) ? "Updated " + new Date(when).toLocaleString("en-GB", { day: "numeric", month: "short",
    year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC" : "";
  document.getElementById("meta").textContent = [updated, every ? "reloads every " + Math.round(every / 60) + " min" : ""]
    .filter(Boolean).join(" · ");
  const app = document.getElementById("app");
  const blocks = (parent, list) => {
    for (const b of Array.isArray(list) ? list : []) {
      const sec = parent.appendChild(el("section", b && COMPACT.has(b.type) ? "compact" : null));
      if (b && b.title) {
        const h = sec.appendChild(el("h2"));
        if (Object.prototype.hasOwnProperty.call(ICONS, b.icon)) h.appendChild(icon(b.icon));
        h.appendChild(document.createTextNode(fmt(b.title)));
      }
      const fn = b && Object.prototype.hasOwnProperty.call(RENDERERS, b.type) ? RENDERERS[b.type] : null;
      let node;
      try { node = fn ? fn(b.data || {}) : json(b); } catch (e) { node = json(b); }
      sec.appendChild(node);
    }
  };
  blocks(app, payload.blocks);

  // Tabs: one page each, the open one named in the address (#<id>), so a reload or a link keeps it.
  const tabs = (Array.isArray(payload.tabs) ? payload.tabs : []).filter((t) => t && TAB_ID.test(String(t.id)));
  if (tabs.length) {
    const nav = app.appendChild(el("nav", "tabs")), pages = new Map();
    nav.setAttribute("role", "tablist");
    for (const t of tabs) {
      if (pages.has(t.id)) continue;
      const button = nav.appendChild(el("button", null, fmt(t.title || t.id)));
      button.type = "button"; button.setAttribute("role", "tab"); button.dataset.tab = t.id;
      const page = app.appendChild(el("div", "page"));
      page.setAttribute("role", "tabpanel"); page.hidden = true;
      blocks(page, t.blocks);
      pages.set(t.id, [button, page]);
    }
    const show = (id) => {
      const open = pages.has(id) ? id : pages.keys().next().value;
      for (const [key, [button, page]] of pages) { button.setAttribute("aria-selected", String(key === open)); page.hidden = key !== open; }
      if (location.hash.slice(1) !== open) {
        try { history.replaceState(null, "", "#" + open); } catch (e) { /* some browsers refuse it for file:// */ }
      }
    };
    nav.addEventListener("click", (e) => {
      const button = e.target.closest("button[data-tab]");
      if (button) { show(button.dataset.tab); window.scrollTo(0, 0); }
    });
    window.addEventListener("hashchange", () => { show(location.hash.slice(1)); window.scrollTo(0, 0); });
    show(location.hash.slice(1));
  }

  // A file a command rewrites in place: reload it from disk, back to the same tab and scroll position.
  if (every) {
    const key = "plsi-scroll:" + location.pathname + location.hash;
    try {
      const y = +sessionStorage.getItem(key);
      sessionStorage.removeItem(key);
      if (y > 0) window.scrollTo(0, y);
    } catch (e) { /* no storage: the reload starts at the top */ }
    setTimeout(() => {
      try { sessionStorage.setItem("plsi-scroll:" + location.pathname + location.hash, String(window.scrollY)); } catch (e) { /* ignore */ }
      location.reload();
    }, every * 1000);
  }
})();
</script>
</body>
</html>
