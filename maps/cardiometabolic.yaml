    factor: 0.45359237
    source: *id003
  - from_unit: '[lb_av]'
    factor: 0.45359237
    source: *id003
  correspondence_type: terminology
- id: bmi
  label: Body mass index
  kind: measured
  unit: kg/m2
  accepts:
    codes:
    - {system: loinc, code: 39156-5, display: 'Body mass index (BMI) [Ratio]'}
    - {system: loinc, code: 89270-3, display: 'Body mass index (BMI) [Ratio] Estimated'}
    reject_codes:
    - {system: loinc, code: 41909-3, display: Deprecated Body mass index (BMI)}
    - {system: loinc, code: 59576-9, display: 'Body mass index (BMI) [Percentile] Per age and sex'}
  derive:
    engine: expr
    model: bmi
    inputs: [height, weight]
    formula: exp(log(weight) - 2 * log(height))  # = weight / height ** 2; logs reject weight or height <= 0
    carry_forward: [height]
  correspondence_type: terminology
  sources:
  - {kind: rule, id: 'expr:bmi'}
