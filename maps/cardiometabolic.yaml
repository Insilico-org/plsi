# Generated once from the live-verified LOINC table (primary/alternate/caution -> accepts.codes, reject -> reject_codes).
# Lp(a) is split by LOINC property (MCnc -> lpa_mass, SCnc -> lpa_molar) and never converted.
# min_evidence_class_for_actions: spec silent; hypothesis_only like blood_phenoage.
kind: plsi_map
schema_version: 1
id: cardiometabolic
title: Cardiometabolic markers
map_version: 1.2.0
claim_level: instantiated
summary: Lipids, apolipoproteins, glycaemia, insulin resistance (HOMA-IR), blood pressure, adiposity and hs-CRP.
tags: [cardiometabolic, lipids, glycaemia, blood_pressure]
