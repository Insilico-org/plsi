- id: homa_ir
  label: HOMA-IR
  kind: derived
  unit: '1'
  derive:
    engine: expr
    model: homa_ir
    inputs: [fasting_glucose, fasting_insulin]
    formula: fasting_glucose / 18.016 * fasting_insulin / 22.5
  correspondence_type: mechanistic
  sources:
  - &id002 {kind: doi, id: 10.1007/BF00280883, title: Matthews DR et al. 1985. Homeostasis model assessment. Diabetologia}
  - {kind: rule, id: 'expr:homa_ir'}
inference_boundaries:
  supports: ['lipid, glycaemic, blood pressure and adiposity levels and their change', HOMA-IR from fasting glucose and fasting insulin drawn
      on the same calendar day, 'BMI as measured, or from each weight with the latest height on or before it (both kept in the series)']
  does_not_support: [diagnosis, cardiovascular risk scores, conversion between Lp(a) mass and molar units, IFCC to NGSP HbA1c conversion,
      BMI for children or adolescents (height still changing)]
  min_evidence_class_for_actions: hypothesis_only
sources:
- *id002
- *id001
- *id003
