# LOINC codes checked against NLM Clinical Tables; free codes where LOINC has no code for the score.
kind: plsi_map
schema_version: 1
id: imaging_scores
title: Imaging scores
map_version: 0.1.0
claim_level: designed
summary: Coronary artery calcium score, carotid intima-media thickness, DXA bone density T-scores of the lumbar spine and femoral neck, and appendicular lean mass index.
tags: [imaging, cardiovascular, bone, muscle]
coordinates:
- id: cac_agatston
  label: Coronary artery calcium score (Agatston), non-contrast cardiac CT
  kind: measured
  unit: '1'
  accepts:
    codes:
    - {system: free, code: imaging_scores.cac_agatston, display: 'Coronary artery calcium Agatston score'}
    reject_codes:
    - {system: loinc, code: 79087-3, display: 'CT Heart and Coronary arteries for calcium scoring WO contrast'}
  recency_days: 1825
  score_window_days: {before: 90, after: 365}
  correspondence_type: terminology
- id: carotid_imt
  label: Carotid intima-media thickness, common carotid artery mean, ultrasound
  kind: measured
  unit: mm
  accepts:
    codes:
    - {system: free, code: imaging_scores.carotid_imt, display: 'Common carotid artery intima-media thickness mean by ultrasound'}
  recency_days: 1095
  score_window_days: {before: 90, after: 365}
  correspondence_type: terminology
- id: bmd_t_lumbar_spine
  label: Bone density T-score, lumbar spine, DXA
  kind: measured
  unit: '1'
  accepts:
    codes:
    - {system: loinc, code: 38267-1, display: 'DXA Lumbar spine [T-score] Bone density'}
    reject_codes:
    - {system: loinc, code: 85394-5, display: 'DXA Lumbar spine [Z-score] Bone density'}
    - {system: loinc, code: 24966-4, display: 'DXA Lumbar spine [Mass/Area] Bone density'}
    - {system: loinc, code: 104938-6, display: 'DXA Spine [T-score] Bone density'}
  recency_days: 1095
  score_window_days: {before: 90, after: 365}
  correspondence_type: terminology
