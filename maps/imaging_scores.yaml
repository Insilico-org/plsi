- id: almi
  label: Appendicular lean mass index (arms and legs lean mass over height squared), DXA
  kind: measured
  unit: kg/m2
  accepts:
    codes:
    - {system: free, code: imaging_scores.almi, display: 'Appendicular lean mass index by DXA'}
    reject_codes:
    - {system: loinc, code: 91557-9, display: 'Lean body weight'}
    - {system: loinc, code: 88334-8, display: 'Lean body weight Calculated'}
    - {system: loinc, code: 8342-8, display: 'Lean body weight estimated by Immersion method'}
    - {system: loinc, code: 8343-6, display: 'Lean body weight estimated by Skin fold method'}
  recency_days: 1095
  score_window_days: {before: 90, after: 365}
  correspondence_type: terminology
inference_boundaries:
  supports: [tracking each score between scans and predictions on it]
  does_not_support: [diagnosis of osteoporosis, coronary disease or sarcopenia, comparing scanners or reference databases, total hip
      T-score (only the femoral neck), body fat (body_composition)]
  min_evidence_class_for_actions: hypothesis_only
