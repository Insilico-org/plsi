  label: Bone density T-score, femoral neck, DXA
  kind: measured
  unit: '1'
  accepts:
    codes:
    - {system: loinc, code: 38263-0, display: 'DXA Femur [T-score] Bone density'}
    - {system: loinc, code: 80947-5, display: 'DXA Femur - right [T-score] Bone density'}
    - {system: loinc, code: 80948-3, display: 'DXA Femur - left [T-score] Bone density'}
    reject_codes:
    - {system: loinc, code: 38264-8, display: 'DXA Hip [T-score] Bone density'}
    - {system: loinc, code: 80934-3, display: 'DXA Femur [Z-score] Bone density'}
    - {system: loinc, code: 24701-5, display: 'DXA Femur [Mass/Area] Bone density'}
