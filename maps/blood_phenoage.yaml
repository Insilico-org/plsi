inference_boundaries:
  supports: [phenotypic age and its acceleration from nine markers drawn on the same calendar day, change of each blood marker and of PhenoAge
      between draws]
  does_not_support: [diagnosis, PhenoAge from markers drawn on different days, DNA-methylation PhenoAge (a different model; see methylation_clocks)]
  min_evidence_class_for_actions: hypothesis_only
sources:
- *id003
- *id001
